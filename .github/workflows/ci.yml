name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: server
      - run: npm run typecheck
        working-directory: server
      - run: npm test
        working-directory: server
      - run: npm run build
        working-directory: server
      # The images run dist/, not tsx: a runtime-only import error (e.g. once from node:stream) would pass the tests
      # and the build, and then kill every worker at boot. Boot the built server and ask it for /healthz.
      - name: The built app must boot
        working-directory: server
        env:
          DATA_DIR: ${{ runner.temp }}/boot
          PORT: '18081'
          HOST: 127.0.0.1
          TT_ENABLED: 'false'
          COOKIE_SECURE: 'false'
          LOG_LEVEL: error
          SETUP_TOKEN: boot-check-setup-token-0123456789
        run: |
          node dist/index.js > boot.log 2>&1 &
          pid=$!
          ok=0
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:18081/healthz >/dev/null 2>&1; then ok=1; break; fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 0.5
          done
          kill "$pid" 2>/dev/null || true
          if [ "$ok" != "1" ]; then echo "the built server did not answer /healthz:"; cat boot.log; exit 1; fi
          echo "built server boots and answers /healthz"
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: server
        continue-on-error: true

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Built UI must not need inline scripts (strict CSP)
        run: "! grep -E '<script>|<script [^>]*>[^<]' web/dist/index.html"

  images:
    runs-on: ubuntu-latest
    needs: [server, web]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: tiktok_logger-app
            context: .
            file: Dockerfile
          - name: tiktok_logger-chromium
            context: chromium
            file: chromium/Dockerfile
          - name: tiktok_logger-caddy
            context: caddy
            file: caddy/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR (main branch and tags only)
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=${{ matrix.name }}
            org.opencontainers.image.description=tiktok_logger — self-hosted encrypted TikTok DM logger
            org.opencontainers.image.licenses=NOASSERTION
      - name: Build (and push on main / tags)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Shellcheck scripts
        run: shellcheck scripts/*.sh chromium/entrypoint.sh caddy/extra-ports.sh
      - name: Validate compose files
        run: |
          printf 'SITE_ADDRESS=example.test\nCONTROL_SECRET=xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx\nSETUP_TOKEN=xxxxxxxxxxxxxxxxxxxx\n' > .env
          docker compose -f docker-compose.yml config --quiet
          cp .env deploy/.env
          docker compose -f deploy/docker-compose.yml config --quiet
