<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#111b21" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>tiktok_logger</title>
  </head>
  <body>
    <div id="root">
      <!-- Replaced by the app as soon as it starts. Shown only if its script cannot run. -->
      <div class="boot">
        <p>Loading tiktok_logger…</p>
        <p class="boot-help">
          Still loading? Your browser may be blocking the app's script — usually because the self-signed certificate
          is not trusted. Reload the page, or trust Caddy's certificate (see the README, "First run").
        </p>
        <noscript><p>tiktok_logger needs JavaScript.</p></noscript>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // After an update the cached index.html can point at a bundle that no longer exists; the module then fails and
      // the boot splash stays forever. Reload once with a cache-busting query to pick up the current index.html.
      (function () {
        var s = document.querySelector('script[type="module"]');
        if (!s) return;
        s.addEventListener('error', function () {
          var u = new URL(location.href);
          if (u.searchParams.has('boot')) return;
          u.searchParams.set('boot', Date.now());
          location.replace(u.toString());
        });
        // Belt and braces for browsers that do not fire 'error' on module scripts.
        setTimeout(function () {
          if (document.getElementById('root') && document.querySelector('.boot')) {
            var u = new URL(location.href);
            if (u.searchParams.has('boot')) return;
            u.searchParams.set('boot', Date.now());
            location.replace(u.toString());
          }
        }, 8000);
      })();
    </script>
  </body>
</html>
